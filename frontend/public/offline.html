<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071312">
  <title>Offline — ExpenseTracker AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #071312;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(11, 33, 29, 0.85);
      border: 1px solid rgba(94, 234, 212, 0.25);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(94, 234, 212, 0.1);
      border: 1px solid rgba(94, 234, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
      stroke: #5eead4;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      color: #042f2e;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(45, 212, 191, 0.25);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5a6 6 0 018.5 8.5m1.5-4a8.5 8.5 0 00-14.8-5.3M12 20h.01M5.6 5.6A11.95 11.95 0 002 12c0 2.8 1 5.4 2.7 7.4" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>ExpenseTracker AI is ready to work offline. Your previously loaded dashboard and cached data remain available. Check your internet connection to sync live updates.</p>
    <button onclick="window.location.reload()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Retry Connection
    </button>
  </div>
</body>
</html>
