plugins {
    id 'com.android.application'
}

android {
    namespace 'app.vercel.expensetrackercom.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vercel.expensetrackercom.twa'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // PWA URL Configuration
        resValue 'string', 'hostName', 'expense-trackercom.vercel.app'
        resValue 'string', 'defaultUrl', 'https://expense-trackercom.vercel.app/'
        resValue 'string', 'appName', 'ExpenseTracker AI'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
